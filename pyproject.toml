[project]
name = "savehub"
version = "0.1.0"
description = "Bank billing pipeline: bank balance files -> revenue, partner payouts, invoices."
readme = "README.md"
# Pinned to 3.12 because the Airflow image runs 3.12: same interpreter locally, in CI and in Airflow.
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
