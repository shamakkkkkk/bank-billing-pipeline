[project]
name = "savehub"
version = "0.1.0"
description = "Bank billing pipeline: bank balance files -> revenue, partner payouts, invoices."
readme = "README.md"
# Pinned to 3.12 because the Airflow image runs 3.12: same interpreter locally, in CI and in Airflow.
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "moto[s3]>=5",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Lambda is a standalone file (it is zipped alone), so put its folder on the path.
pythonpath = ["lambdas/validate_bank_file", "tests"]
# Integration tests need the running docker stack: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: needs docker compose (LocalStack) running"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
