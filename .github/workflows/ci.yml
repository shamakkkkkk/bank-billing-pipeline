name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # DuckDB in memory + moto for S3: no Docker, no cloud, no secrets needed.
      - run: uv run pytest -v

  dags:
    name: DAGs import in the Airflow image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t savehub-airflow:ci .
      - run: >
          docker run --rm
          -v "$PWD/dags:/opt/airflow/dags:ro"
          -v "$PWD/src:/opt/airflow/src:ro"
          -v "$PWD/scripts:/opt/airflow/scripts:ro"
          -e PYTHONPATH=/opt/airflow/src
          -e AIRFLOW__CORE__LOAD_EXAMPLES=false
          savehub-airflow:ci python /opt/airflow/scripts/check_dags.py
